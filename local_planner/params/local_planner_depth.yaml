local_planner:
  ros__parameters:
    # ============================================================================
    # 通用设置 (Common Settings)
    # ============================================================================
    planner_rate_hz: 10.0      # 规划器运行频率 [Hz]，影响响应速度和CPU负载
    use_sim_time: true         # 使用仿真时间（SITL必须为true，与Gazebo时间同步）
    enable_visualization: true # 启用 RViz 可视化输出（搜索树、FOV、路径等）

    # ============================================================================
    # MAVROS2 话题配置 (MAVROS2 Topic Configuration)
    # ============================================================================
    pose_topic: /mavros/local_position/pose           # 无人机位姿输入话题
    velocity_topic: /mavros/local_position/velocity_local  # 无人机速度输入话题
    trajectory_topic: /mavros/trajectory/desired      # PX4 期望轨迹输入（Mission模式）
    setpoint_topic: /mavros/setpoint_position/local   # 位置设定点输出话题

    # 障碍物数据输出 - 发送到 MAVROS 供 PX4 避障使用
    obstacle_scan_topic: /mavros/obstacle/send        # 障碍物距离数据输出话题

    # ============================================================================
    # 点云输入配置 (Pointcloud Input Configuration)
    # ============================================================================
    pointcloud_topics: ["/camera/depth/points"]  # 深度相机点云话题列表（支持多相机）
    target_cloud_frame: "map"  # 目标坐标系，将点云变换到世界坐标系
                               # 重要：需要完整的 TF 链 map -> base_link -> camera_frame
                               # 由 launch 文件提供 base_link -> camera_frame 的静态 TF

    # ============================================================================
    # 目标点配置 (Goal Configuration)
    # ============================================================================
    use_trajectory_goal: true  # true: 从PX4 trajectory获取目标（Mission模式）
                               # false: 使用下面的固定目标点
    goal_x: 10.0               # 固定目标点 X 坐标 [m]（仅当use_trajectory_goal=false时有效）
    goal_y: 0.0                # 固定目标点 Y 坐标 [m]
    goal_z: 3.0                # 固定目标点 Z 坐标 [m]

    # ============================================================================
    # 航点平滑配置 (Waypoint Smoothing)
    # ============================================================================
    smoothing_speed_xy: 1.0   # 水平方向最大平滑速度 [m/s]
    smoothing_speed_z: 5.0     # 垂直方向最大平滑速度 [m/s]

    # ==========================================================================
    # Pull-back Threshold
    # ==========================================================================
    # 当无人机距离先前航线投影点小于此阈值时，规划器会将投影点设置为目标，
    # 以避免被拉回原始航线。增大该值会减少“回头”行为，减小会更容易被拉回。
    mpc_xy_cruise: 3.0

    # ============================================================================
    # 传感器参数 (Sensor Parameters)
    # ============================================================================
    max_sensor_range: 29.0     # 传感器最大感知距离 [m]，超出此距离的点被忽略
    min_sensor_range: 0.2      # 传感器最小感知距离 [m]，小于此距离的点被忽略

    # ============================================================================
    # 代价函数参数 (Cost Function Parameters)
    # 这些参数控制路径规划的行为偏好
    # ============================================================================
    pitch_cost_param: 25.0      # 垂直方向(俯仰)代价权重 (原始ROS1默认值: 25.0)
                               # - 值越低：更愿意爬升/下降（飞高越过障碍物）
                               # - 值越高：更倾向于水平绕行
                               # - 推荐: 5-10（允许爬升）, 25+（强制水平）
    
    yaw_cost_param: 60.0        # 水平转向(偏航)代价权重
                               # - 值越低：更愿意大幅度转向
                               # - 值越高：更倾向于保持当前航向
    
    velocity_cost_param: 15000.0  # 速度变化代价权重
                               # - 值越高：更倾向于保持当前速度方向
                               # - 有助于轨迹平滑，减少抖动
    
    obstacle_cost_param: 15.0  # 障碍物距离代价权重
                               # - 值越高：越远离障碍物（相当于增大虚拟安全距离）
                               # - 值越低：允许更近距离通过障碍物
                               # - 注意：此参数是安全距离的阈值 [m]

    # ============================================================================
    # 树搜索规划器参数 (StarPlanner Tree Search Parameters)
    # ============================================================================
    tree_heuristic_weight: 35.0   # A*搜索启发式权重 (原始ROS1默认值: 35.0)
                                  # 值越大越倾向于直接朝目标走，值小则更充分探索
    children_per_node: 16           # 每个节点扩展的子节点数量（方向候选数）
    n_expanded_nodes: 80           # 最大扩展节点数 (原始默认: 40)，越大路径越优
    tree_node_distance: 1.0       # 树节点之间的距离 [m] (原始默认: 1.0)
                                   # 较小的值 = 更精细的路径分辨率
    
    # 障碍物安全裕度（间接的"碰撞体积"参数）
    # 由于没有显式的机体尺寸参数，通过角度平滑来模拟安全包络
    # 计算方式：在距离 D 处，安全裕度 ≈ D * tan(smoothing_margin_degrees)
    # 例如：60° 在 5m 处 ≈ 5 * tan(60°) ≈ 8.66m 的横向安全距离
    smoothing_margin_degrees: 40.0 # 障碍物平滑边界 [度]

    # ============================================================================
    # 超时配置 (Timeout Configuration)
    # ============================================================================
    timeout_startup: 2.0       # 启动超时 [s]，等待传感器数据的最大时间
    timeout_critical: 0.5      # 临界超时 [s]，数据中断后进入紧急模式的时间
    timeout_termination: 15.0  # 终止超时 [s]，长时间无数据后停止规划

    # ============================================================================
    # 点云处理参数 (Pointcloud Processing Parameters)
    # ============================================================================
    max_point_age_s: 20.0      # 点云最大保留时间 [s]，用于构建历史地图
    min_num_points_per_cell: 1 # 直方图单元格最小点数，用于过滤噪声

    # ============================================================================
    # 相机坐标系偏移 (Camera Coordinate System Offset)
    # ============================================================================
    # 用于校正深度相机安装角度与机体坐标系的偏差
    # 正值表示相机相对机头顺时针旋转
    camera_yaw_offset_deg: 0.0 # 相机偏航角偏移 [度]

